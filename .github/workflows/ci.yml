name: Student Performance ML CI

on:
push:
branches: [main]
pull_request:
branches: [main]

jobs:
test-and-build:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"

  - name: Install dependencies
    run: |
      python -m pip install --upgrade pip
      python -m pip install pandas numpy scikit-learn fastapi "uvicorn[standard]" joblib pydantic pytest httpx streamlit requests

  - name: Generate dataset
    run: python generate_data.py

  - name: Train ML model
    run: python train.py

  - name: Run automated tests
    run: python -m pytest -v

  - name: Build Docker image
    run: docker build -t student-performance-api:ci .

  - name: Start Docker container
    run: docker run -d --name student-api -p 8000:8000 student-performance-api:ci

  - name: Verify running service
    shell: bash
    run: |
      for i in {1..30}; do
        if curl -fsS http://localhost:8000/ready; then
          echo "Service is ready"
          break
        fi
        sleep 2
      done

      curl -fsS http://localhost:8000/health
      curl -fsS http://localhost:8000/ready

      curl -fsS -X POST http://localhost:8000/predict \
        -H "Content-Type: application/json" \
        -d '{"study_hours":5,"attendance":85,"previous_score":70}'

  - name: Show container logs
    if: always()
    run: docker logs student-api || true

  - name: Stop container
    if: always()
    run: docker rm -f student-api || true
```
